<div class="authMain">
  <app-navbar></app-navbar>

  <div class="container">
    <div class="formContainer">
      <div class="fcRight">

        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="f1"
        >

          <p style="font-weight: 600">
            Login Form
          </p>

          <!-- Email -->
          <input
            formControlName="email"
            placeholder="Email"
            type="email"
          />

          <!-- Password -->
          <input
            type="password"
            formControlName="password"
            placeholder="Password"
          />

          <!-- User Role -->
          <select
            name="role"
            formControlName="userType"
          >
            <option value="">
              Select User Role
            </option>

            <option
              *ngFor="let role of roles"
              [value]="role.value"
            >
              {{ role.name }}
            </option>
          </select>

          <!-- Login Button -->
          <button
            type="submit"
            [disabled]="loading || loginForm.invalid"
            [ngClass]="{
              'disabled-btn': loading || loginForm.invalid
            }"
            class="fb1"
          >

            <span *ngIf="!loading">
              Login
            </span>

            <span
              *ngIf="loading"
              class="spinner"
            ></span>

          </button>

        </form>

        <a href="/forgot-password">
          Forgot Your Password? Reset Password
        </a>

        <br />

        <a href="/signup">
          Don't Have An Account? Sign Up
        </a>

      </div>
    </div>
  </div>
</div>
